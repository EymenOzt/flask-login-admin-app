<h2>Sign Up</h2>
<form method="post">
  Username: <input type="text" name="username" required><br>
  Password: <input type="password" name="password" required><br>
  <small>Password must be 3-21 characters, at least 1 uppercase and 1 lowercase letter.</small><br>
  <input type="submit" value="Sign Up">
</form>
<a href="{{ url_for('login') }}">Login Up</a>
